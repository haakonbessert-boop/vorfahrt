<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vorfahrt">
<title>Vorfahrt-Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5;--side:#F3F1EA;--surface:#FFFFFF;--text:#1F1E1D;--muted:#6F6D66;--border:#E6E3DA;
  --accent:#C96442;--accent-h:#B4553A;--accent-soft:#F6E9E2;--ubub:#EFECE3;
  --ok:#2F7D4F;--ok-soft:#E4F1E8;--bad:#B5413A;--bad-soft:#F8E5E2;
  --grass:#DCE2CE;--road:#7A7772;--drive:#A4A19A;--mark:#FAFAF7;--badge:#1F1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --serif:"Source Serif 4",ui-serif,Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624;--side:#1F1E1D;--surface:#30302E;--text:#F3F1EA;--muted:#A6A39A;--border:#3E3D3A;
  --accent:#D97757;--accent-h:#E58A6B;--accent-soft:#3D2E28;--ubub:#3A3936;
  --ok:#6CC28F;--ok-soft:#24352A;--bad:#E8867C;--bad-soft:#3E2826;
  --grass:#323A2E;--road:#55534F;--drive:#6B6964;--mark:#E9E8E2;--badge:#F3F1EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#262624;--side:#1F1E1D;--surface:#30302E;--text:#F3F1EA;--muted:#A6A39A;--border:#3E3D3A;
  --accent:#D97757;--accent-h:#E58A6B;--accent-soft:#3D2E28;--ubub:#3A3936;
  --ok:#6CC28F;--ok-soft:#24352A;--bad:#E8867C;--bad-soft:#3E2826;
  --grass:#323A2E;--road:#55534F;--drive:#6B6964;--mark:#E9E8E2;--badge:#F3F1EA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{display:flex;height:100dvh}

/* Sidebar */
.side{width:272px;flex-shrink:0;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 12px;font-family:var(--serif);font-size:19px;font-weight:600}
.brand svg{width:24px;height:24px;color:var(--accent)}
.newbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:transparent;font-weight:500;text-align:left}
.newbtn .plus{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;line-height:1}
.newbtn:hover,.navbtn:hover{background:rgba(0,0,0,.05)}
:root[data-theme="dark"] .newbtn:hover,:root[data-theme="dark"] .navbtn:hover{background:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){.newbtn:hover,.navbtn:hover{background:rgba(255,255,255,.06)}}
.sec{font-size:12px;color:var(--muted);padding:14px 10px 6px;font-weight:500}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:9px;text-align:left;font-size:14px}
.navbtn.active{background:var(--ubub);font-weight:500}
.navbtn .cnt{font-size:12px;color:var(--muted)}
.stat{padding:6px 10px}
.stat .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.stat .row span:last-child{color:var(--muted)}
.bar{height:5px;border-radius:9px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.sidefoot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--muted);line-height:1.45}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.scrim{display:none}
@media (max-width:860px){
  .side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow);padding-top:calc(12px + env(safe-area-inset-top))}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;min-height:52px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--ubub)}
.iconbtn svg{width:20px;height:20px}
.toptitle{flex:1;min-width:0;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{font-size:13px;color:var(--muted);padding:4px 10px;border:1px solid var(--border);border-radius:99px;white-space:nowrap}
.desk-hide{display:none}
@media (max-width:860px){.desk-hide{display:grid}}

.chat{flex:1;overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}
.inner{max-width:720px;margin:0 auto}
.msg{margin:20px 0;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.ai{display:flex;gap:12px}
.avatar{width:28px;height:28px;flex-shrink:0;color:var(--accent);margin-top:1px}
.msg.ai .body{flex:1;min-width:0;font-family:var(--serif);font-size:16.5px;line-height:1.6}
.msg.ai .body p{margin:0 0 10px}
.msg.ai .body p:last-child{margin-bottom:0}
.label{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-bottom:8px;letter-spacing:.01em}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--ubub);padding:10px 15px;border-radius:18px;max-width:82%;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:2px 0 14px}
.card .scene{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.legend{font-family:var(--sans);font-size:12px;color:var(--muted);padding:8px 14px 10px;border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap}
.verdict{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-weight:600;font-size:14px;padding:5px 11px;border-radius:99px;margin-bottom:10px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.tip{font-family:var(--sans);font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 13px;margin-top:12px;line-height:1.45}
.tip b{color:var(--accent)}
.sheet h3{font-family:var(--serif);font-size:17px;margin:18px 0 6px;font-weight:600}
.sheet h3:first-child{margin-top:0}
.sheet ol,.sheet ul{margin:0 0 8px;padding-left:22px}
.sheet li{margin:3px 0}
.signrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:15.5px}
.signrow svg{width:30px;height:30px;flex-shrink:0}

/* Welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 4px 40px}
.welcome .mark{width:44px;height:44px;color:var(--accent);margin-bottom:14px}
.welcome h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,6vw,38px);line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.welcome p{color:var(--muted);margin:0 0 26px;max-width:460px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* Composer */
.composer{padding:6px 16px calc(12px + env(safe-area-inset-bottom))}
.cbox{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:8px}
.cbox:empty{display:none}
.chint{font-size:12.5px;color:var(--muted);padding:4px 8px 2px}
.opt{display:flex;width:100%;text-align:left;gap:11px;align-items:center;padding:11px 12px;border:1px solid transparent;border-radius:14px;background:transparent;margin:2px 0;line-height:1.35}
.opt:hover{background:var(--ubub)}
.opt:active{transform:scale(.99)}
.opt .k{width:24px;height:24px;flex-shrink:0;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:500}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:11px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.primary:hover{background:var(--accent-h)}
.ghost{background:transparent;border:1px solid var(--border);border-radius:14px;padding:11px 16px}
.ghost:hover{background:var(--ubub)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}

/* SVG scene */
.grass{fill:var(--grass)}.road{fill:var(--road)}.drive{fill:var(--drive)}
.cl{stroke:var(--mark);stroke-width:1.6;stroke-dasharray:9 7}
.sl{stroke:var(--mark);stroke-width:3}
.sl.dash{stroke-dasharray:4 3;stroke-width:2.6}
.curb{stroke:var(--mark);stroke-width:2.2;stroke-dasharray:3 3;opacity:.8}
.zebra{fill:var(--mark)}
.mainhl{stroke:#F4C20D;stroke-width:56;fill:none;opacity:.38;stroke-linejoin:round}
.blink{fill:#FFB020;animation:blink .9s steps(1) infinite}
.blue{fill:#2D7CF6;animation:blink .5s steps(1) infinite}
.blue.b2{animation-delay:.25s}
@keyframes blink{50%{opacity:.12}}
.badge circle{fill:var(--badge)}.badge text{fill:var(--bg);font:700 11px var(--sans);text-anchor:middle}
.clabel{font:700 10px var(--sans);fill:#fff;text-anchor:middle;pointer-events:none}
.tlabel{font:500 9px var(--sans);fill:var(--muted);text-anchor:middle}
.parties{display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 4px}
.party{flex:1 1 30%;min-width:96px;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 12px;border:1px solid var(--border);border-radius:14px;background:transparent;font-weight:600;font-size:16px}
.party:hover{background:var(--ubub)}.party:active{transform:scale(.97)}
.party i{width:12px;height:12px;border-radius:50%;display:inline-block}
.tap{cursor:pointer}
.party.picked{border-color:var(--accent);background:var(--accent-soft)}
.party .num{margin-left:4px;min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.party.yn{font-size:17px;padding:16px 12px}
.ghost.small{padding:7px 12px;font-size:13px;margin-top:4px}
.hint{font-family:var(--sans);font-size:14px;color:var(--muted)}
.blinkg{fill:#2ECC71;animation:blink .9s steps(1) infinite}
:root{--sky1:#BBD6EA;--sky2:#E8F0F3;--trees:#A7B897;--walk:#CDC9C0;--hedge:#8CA27B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1C2632;--sky2:#323E48;--trees:#2A3326;--walk:#5E5C57;--hedge:#2F3B2A}}
:root[data-theme="dark"]{--sky1:#1C2632;--sky2:#323E48;--trees:#2A3326;--walk:#5E5C57;--hedge:#2F3B2A}
.trees{fill:var(--trees)}.walk{fill:var(--walk)}.hedge{fill:var(--hedge)}.mkf{fill:var(--mark)}.curbfp{fill:var(--mark);opacity:.7}
.card .scene.fp{max-width:560px}
.sol-label{font-family:var(--sans);font-size:12.5px;color:var(--muted);padding:9px 14px 4px;border-top:1px solid var(--border)}
@media (prefers-reduced-motion:reduce){.blink,.blinkg,.blue,.msg{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span id="brandIcon"></span>Vorfahrt-Coach</div>
    <button class="newbtn" id="newBtn"><span class="plus">+</span>Neues Training</button>
    <div class="sec">Kategorien</div>
    <nav id="nav"></nav>
    <div class="sec">Dein Stand</div>
    <div id="stats"></div>
    <div class="sec">Hilfe</div>
    <button class="navbtn" id="sheetBtn">Spickzettel: Wer hat Vorfahrt?</button>
    <div class="sidefoot">Fortschritt wird nur in diesem Browser gespeichert.<br><button class="linkbtn" id="resetBtn">Fortschritt zurücksetzen</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="iconbtn desk-hide" id="menuBtn" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="toptitle" id="topTitle">Vorfahrt-Coach</div>
      <span class="progress" id="progress" hidden></span>
      <button class="iconbtn desk-hide" id="newBtn2" aria-label="Neues Training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <div class="chat" id="chat"><div class="inner" id="inner"></div></div>
    <div class="composer"><div class="cbox" id="cbox"></div><div class="foot">Lernhilfe – ersetzt keine Fahrstunde. Im Zweifel gilt die StVO.</div></div>
  </main>
</div>

<script>
/* ---------- Icon (Lenkrad) ---------- */
const WHEEL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M3.6 10.2c2.6-.9 5.4-1.3 8.4-1.3s5.8.4 8.4 1.3M10.4 13.8 7 20M13.6 13.8 17 20"/></svg>`;
document.getElementById('brandIcon').innerHTML = WHEEL;

/* ---------- Kategorien ---------- */
const CATS = {
  vs:   'Vorfahrtstraße & Schilder',
  abk:  'Abknickende Vorfahrt',
  rvl:  'Rechts vor links',
  ampel:'Ampel & Polizei',
  fuss:'Fußgänger',
  sonder:'Sonderfälle'
};

/* ---------- Situationen ----------
   arms: vorhandene Straßen (N/E/S/W), signs: Schilder je Zufahrt ('z' = Zusatzzeichen abknickende Vorfahrt),
   main: Verlauf der Vorfahrtstraße (für die Auflösung), cars: arm + move (straight/left/right),
   order: Auflösung in Gruppen (gleiche Gruppe = gleichzeitig). */
const SC = [
 {id:'vs1',cat:'vs',title:'Vorfahrt gewähren',arms:'NESW',signs:{S:['205'],N:['205'],W:['306'],E:['306']},main:['W','E'],
  cars:[{id:'du',arm:'S',move:'straight'},{id:'A',arm:'W',move:'straight'}],
  q:'Du willst geradeaus über die Kreuzung. Wer fährt zuerst?',
  opts:[['A',1],['Du – A kommt doch von links',0],['Wer zuerst an der Kreuzung ist',0]],order:[['A'],['du']],
  ex:'Vor dir steht „Vorfahrt gewähren“ (Zeichen 205), A fährt auf der Vorfahrtstraße (Zeichen 306). Also wartest du – egal, ob A von links oder rechts kommt. Rechts vor links spielt keine Rolle, sobald Schilder die Vorfahrt regeln.',
  tip:'Erst das Schild suchen, dann die Autos anschauen.'},

 {id:'vs2',cat:'vs',title:'Linksabbiegen auf der Vorfahrtstraße',arms:'NESW',signs:{S:['306'],N:['306'],E:['205'],W:['205']},main:['S','N'],
  cars:[{id:'du',arm:'S',move:'left'},{id:'A',arm:'N',move:'straight'},{id:'B',arm:'E',move:'straight'}],
  q:'Du willst links abbiegen. In welcher Reihenfolge wird gefahren?',
  opts:[['A → Du → B',1],['Du → A → B',0],['B → A → Du',0],['A → B → Du',0]],order:[['A'],['du'],['B']],
  ex:'Du und A seid auf der Vorfahrtstraße, B hat Zeichen 205 und muss euch beide durchlassen. Zwischen euch beiden gilt die Abbiegeregel: Wer links abbiegt, lässt den Gegenverkehr durch (§ 9 StVO). Also erst A, dann du, zuletzt B.',
  tip:'Vorfahrtstraße heißt nicht: Ich darf immer zuerst. Gegenverkehr geht beim Linksabbiegen vor.'},

 {id:'vs3',cat:'vs',title:'Rechts abbiegen mit 205',arms:'NESW',signs:{S:['205'],N:['205'],W:['306'],E:['306']},main:['W','E'],
  cars:[{id:'du',arm:'S',move:'right'},{id:'A',arm:'W',move:'straight'}],
  q:'Du willst nur rechts abbiegen. Musst du A durchlassen?',
  opts:[['Ja, A hat Vorfahrt',1],['Nein, beim Rechtsabbiegen nicht',0],['Nur wenn A blinkt',0]],order:[['A'],['du']],
  ex:'Zeichen 205 gilt für jede Fahrtrichtung. Beim Rechtsabbiegen fährst du genau in die Spur, auf der A kommt – du würdest A also behindern. A fährt zuerst.',
  tip:'205 gilt immer – geradeaus, links und rechts.'},

 {id:'vs4',cat:'vs',title:'Stoppschild',arms:'NESW',signs:{S:['206'],N:['206'],W:['306'],E:['306']},main:['W','E'],
  cars:[{id:'du',arm:'S',move:'straight'},{id:'A',arm:'E',move:'straight'}],
  q:'',opts:[],order:[['A'],['du']],
  ex:'Zeichen 206: Du hältst an der Haltlinie vollständig an – immer, auch wenn alles frei wirkt. Danach gewährst du Vorfahrt: A ist auf der Vorfahrtstraße und fährt zuerst. Durchrollen ist in der Prüfung ein klassischer Fehler.',
  tip:'Stopp = Räder stehen. Jedes Mal.'},

 {id:'vs5',cat:'vs',title:'Stoppschild und Rechtsabbiegen',arms:'NESW',signs:{S:['206'],N:['206'],W:['306'],E:['306']},main:['W','E'],
  cars:[{id:'du',arm:'S',move:'right'},{id:'A',arm:'W',move:'straight'}],
  q:'Du willst rechts abbiegen. Was ist richtig?',
  opts:[['Anhalten, A durchlassen, dann abbiegen',1],['Ohne Anhalten zügig vor A abbiegen',0],['Kein Halt nötig, weil du nur rechts abbiegst',0]],order:[['A'],['du']],
  ex:'Am Stoppschild hältst du immer an. Danach gilt dasselbe wie bei 205: A ist auf der Vorfahrtstraße und kommt in die Spur, in die du einbiegst. Also A abwarten.',
  tip:'Erst stehen, dann schauen, dann fahren.'},

 {id:'vs6',cat:'vs',title:'Zwei Autos auf der Vorfahrtstraße',arms:'NESW',signs:{S:['205'],N:['205'],W:['306'],E:['306']},main:['W','E'],
  cars:[{id:'du',arm:'S',move:'left'},{id:'A',arm:'W',move:'straight'},{id:'B',arm:'E',move:'left'}],
  q:'Du willst links abbiegen. A kommt von links, B von rechts. Reihenfolge?',
  opts:[['A → B → Du',1],['B → A → Du',0],['A → Du → B',0],['Du → A → B',0]],order:[['A'],['B'],['du']],
  ex:'A und B haben beide Vorrang vor dir (du hast 205). Untereinander gilt: B biegt links ab und lässt den Gegenverkehr A durch. Also A, dann B, zuletzt du.',
  tip:'Erst klären, wer auf der Vorfahrtstraße ist. Dann die Abbiegeregeln unter denen anwenden.'},

 {id:'vs7',cat:'vs',title:'Vorfahrt an der nächsten Kreuzung',arms:'NESW',signs:{S:['301'],N:['301'],W:['205'],E:['205']},main:['S','N'],
  cars:[{id:'du',arm:'S',move:'straight'},{id:'A',arm:'W',move:'straight'}],
  q:'Du willst geradeaus. Wer fährt zuerst?',
  opts:[['Du',1],['A',0],['Wer zuerst da ist',0]],order:[['du'],['A']],
  ex:'Zeichen 301 gibt dir Vorfahrt an genau dieser Kreuzung oder Einmündung. A hat „Vorfahrt gewähren“ und wartet. Achtung: 301 gilt nur einmal – an der Kreuzung danach musst du neu schauen.',
  tip:'301 = Vorfahrt nur an der nächsten Kreuzung. 306 = Vorfahrt bis zum Ende-Schild (307).'},

 {id:'vs8',cat:'vs',title:'301 und Linksabbiegen',arms:'NESW',signs:{S:['301'],N:['301'],W:['205'],E:['205']},main:['S','N'],
  cars:[{id:'du',arm:'S',move:'left'},{id:'A',arm:'E',move:'straight'},{id:'B',arm:'N',move:'straight'}],
  q:'Du willst links abbiegen. Reihenfolge?',

    case '301': return `<polygon points="-11,9 11,9 0,-10" fill="#fff" stroke="#C8102E" stroke-width="3" stroke-linejoin="round"/><path d="M0,-3.5V6" stroke="#111" stroke-width="2.6"/><path d="M-4.2,1.4H4.2" stroke="#111" stroke-width="1.1"/>`;

  }
  return '';
}
function zusatzSVG(signArm, arms, main){
  const L=9;
  let g = `<rect x="-13" y="-11" width="26" height="22" rx="1.5" fill="#fff" stroke="#222" stroke-width="1"/><g transform="rotate(${VIEWROT[signArm]})">`;
  arms.forEach(a=>{const d=DIR[a]; g+=`<line x1="0" y1="0" x2="${d[0]*L}" y2="${d[1]*L}" stroke="#555" stroke-width=".9"/>`;});
  g += `<path d="M${DIR[main[0]][0]*L},${DIR[main[0]][1]*L}L0,0L${DIR[main[1]][0]*L},${DIR[main[1]][1]*L}" stroke="#000" stroke-width="4.2" fill="none" stroke-linejoin="miter"/>`;
  return g + `</g>`;
}
function lightSVG(state){
  const on = {red:'#E53935',yellow:'#FFB300',green:'#2ECC71'}, off='#4a4a4a';
  const c = k => state===k ? on[k] : off;
  return `<rect x="-6" y="-15" width="12" height="30" rx="3" fill="#1d1d1d"/>`+
    `<circle cy="-8.5" r="3.6" fill="${c('red')}"/><circle cy="0" r="3.6" fill="${c('yellow')}"/><circle cy="8.5" r="3.6" fill="${c('green')}"/>`;
}
function carSVG(c){

function arrowSVG(c){

function scene(s, solved){
  const arms = s.arms.split('');
  const signs = s.signs||{}, lights = s.lights||{};
  let o = `<svg class="scene" viewBox="0 0 300 300" role="img" aria-label="${s.title}">`;
  o += `<rect width="300" height="300" class="grass"/>`;
  const R={N:[120,0,60,120],S:[120,180,60,120],E:[180,120,120,60],W:[0,120,120,60]};
  const RW={N:[103,0,94,120],S:[103,180,94,120],E:[180,103,120,94],W:[0,103,120,94]};
  o += `<rect x="103" y="103" width="94" height="94" class="walk"/>`;
  arms.forEach(a=>{ if(s.drive===a) return; const r=RW[a]; o+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" class="walk"/>`; });
  o += `<rect x="120" y="120" width="60" height="60" class="road"/>`;
  arms.forEach(a=>{const r=R[a]; o+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" class="${s.drive===a?'drive':'road'}"/>`;});
  if(s.drive){

    o += `<path d="${cb}" class="curb"/>`;
    const lp={E:[240,112],W:[60,112],N:[210,40],S:[210,262]}[s.drive];
    o += `<text class="tlabel" x="${lp[0]}" y="${lp[1]}">Parkplatz</text>`;
  }
  if(solved && s.main){
    const OUT={N:[150,0],S:[150,300],E:[300,150],W:[0,150]};
    o += `<path class="mainhl" d="M${OUT[s.main[0]]}L150,150L${OUT[s.main[1]]}"/>`;
  }
  const CL={N:[150,0,150,116],S:[150,184,150,300],E:[184,150,300,150],W:[0,150,116,150]};
  arms.forEach(a=>{ if(s.drive===a) return; const l=CL[a]; o+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" class="cl"/>`;});
  const SL={S:[150,185,180,185],N:[120,115,150,115],E:[185,120,185,150],W:[115,150,115,180]};
  arms.forEach(a=>{
    const sg=signs[a]||[], l=SL[a];
    if(sg.includes('206')||lights[a]) o+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" class="sl"/>`;
    else if(sg.includes('205')) o+=`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" class="sl dash"/>`;
  });
  if(s.zebra==='N') for(let x=122;x<178;x+=8.1) o+=`<rect class="zebra" x="${x}" y="79" width="4.3" height="22"/>`;
  s.cars.forEach(c=>{ o+=arrowSVG(c); });
  s.cars.forEach(c=>{ o+=carSVG(c); });
  (s.peds||[]).forEach(pd=>{ o+=topPed(pd); });
  Object.keys(signs).forEach(a=>{
    const sg=signs[a]; if(!sg.length) return;
    const [x,y]=ARM[a].sign, main=sg.filter(t=>t!=='z')[0];
    o += `<g transform="translate(${x},${y})">${signSVG(main)}</g>`;
    if(sg.includes('z')) o += `<g transform="translate(${x},${y+26})">${zusatzSVG(a,arms,s.main)}</g>`;
  });
  Object.keys(lights).forEach(a=>{
    const [x,y]=ARM[a].light;
    o += `<g transform="translate(${x},${y})">${lightSVG(lights[a])}</g>`;
    if(s.gp===a) o += `<g transform="translate(${x},${y+24})">${signSVG('720')}</g>`;
  });
  if(s.police) o += `<circle cx="150" cy="150" r="13" fill="var(--surface)" opacity=".85"/><text x="150" y="157" font-size="19" text-anchor="middle">👮</text>`;
  if(solved && s.order){
    s.order.forEach((grp,i)=>grp.forEach(id=>{
      let bx,by; const c=s.cars.find(k=>k.id===id);
      if(id==='ped'&&(s.peds||[]).length){ const p=mapXY(...s.peds[0].pos); bx=p[0]+13; by=p[1]-13; }
      else if(c){ const a=ARM[c.arm]; bx=a.car[0]-a.fwd[0]*30; by=a.car[1]-a.fwd[1]*30; }
      else return;
      o+=`<g class="badge"><circle cx="${bx}" cy="${by}" r="9"/><text x="${bx}" y="${by+4}">${i+1}</text></g>`;
    }));
  }
  return o + `</svg>`;
}

/* ---------- Auf Fahrersicht drehen: „Du“ kommt immer von unten (S) ---------- */
const ORDER=['N','E','S','W'];
function rel(s){
  const du=s.cars.find(c=>c.id==='du').arm, r=ORDER.indexOf(du)-2;

  const mo=o=>{const n={};Object.keys(o||{}).forEach(k=>n[m(k)]=o[k]);return n;};
  return {...s, arms:s.arms.split('').map(m).join(''), signs:mo(s.signs), lights:mo(s.lights),

  const x1=arm==='W'?-3.95:3.6, z1=arm==='W'?8:11.5;
  if(type==='solid') return quad(x1,x1+.35,z1,z1+3.5,'mkf');
  for(let z=z1;z<z1+3.4;z+=.62) o+=quad(x1,x1+.35,z,z+.36,'mkf'); return o;
}
function lineType(s,a){ const sg=(s.signs||{})[a]||[]; return (sg.includes('206')||(s.lights||{})[a])?'solid':sg.includes('205')?'dash':''; }
function postStack(s){
  const sg=(s.signs||{}).S||[], li=(s.lights||{}).S, gp=s.gp==='S', main=sg.filter(t=>t!=='z')[0], z=sg.includes('z');
  if(!main&&!li&&!gp) return '';
  const items=[];
  if(li) items.push([46,(x,y)=>`<g transform="translate(${x},${y}) scale(1.5)">${lightSVG(li)}</g>`]);
  if(gp) items.push([20,(x,y)=>`<g transform="translate(${x},${y}) scale(1.45)">${signSVG('720')}</g>`]);
  if(main) items.push([37,(x,y)=>`<g transform="translate(${x},${y}) scale(1.65)">${signSVG(main)}</g>`]);
  if(z) items.push([30,(x,y)=>`<g transform="translate(${x},${y}) scale(1.32)">${zusatzSVG('S',s.arms.split(''),s.main)}</g>`]);
  const [bx,by]=P(5.3,5.6), total=items.reduce((a,i)=>a+i[0]+4,0);
  let y=by-56-total, g=`<line x1="${bx}" y1="${by}" x2="${bx}" y2="${y+8}" stroke="#8B9196" stroke-width="3.2"/>`;
  items.forEach(([h,fn])=>{ g+=fn(bx,y+h/2); y+=h+4; });
  return g;
}
function fpScene(s){
  const arms=s.arms.split(''), has=a=>arms.includes(a), du=s.cars.find(c=>c.id==='du');
  let o=`<svg class="scene fp" viewBox="0 0 400 300" role="img" aria-label="Fahrersicht: ${s.title}">`;
  o+=`<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>`;
  o+=`<rect width="400" height="${HZ+1}" fill="url(#skyg)"/><rect y="${HZ}" width="400" height="${300-HZ}" class="grass"/>`;
  o+=`<path d="M0,${HZ+1} V${HZ-5} Q30,${HZ-13} 70,${HZ-6} T150,${HZ-8} T230,${HZ-4} T310,${HZ-10} T400,${HZ-5} V${HZ+1}Z" class="trees"/>`;
  const L=has('W')?-140:-3.5, R=has('E')?140:3.5;
  /* Gehwege (2 m) */
  if(has('N')) o+=quad(-5.5,5.5,15,900,'walk');
  o+=quad(has('W')?-140:-5.5, has('E')?140:5.5, 6,17,'walk');
  if(s.drive!=='S') o+=quad(-5.5,5.5,2.4,8,'walk');
  if(has('N')) o+=quad(-3.5,3.5,15,900,'road');
  else { const a=P(-14,17.4), b=P(14,17.4), h=F*1.5/17.4; o+=`<rect x="${a[0]}" y="${a[1]-h}" width="${b[0]-a[0]}" height="${h}" rx="4" class="hedge"/>`; }
  o+=quad(L,R,8,15,'road');
  if(s.drive==='S'){ o+=quad(-3.5,3.5,2.4,6,'drive'); o+=quad(-3.5,3.5,7.85,8,'curbfp'); }
  else o+=quad(-3.5,3.5,2.4,8,'road');
  if(s.drive!=='S') for(let z=3;z<7.3;z+=2) o+=quad(-.09,.09,z,z+1,'mkf');
  if(has('N')) for(let z=16.5;z<160;z*=1.3) o+=quad(-.1,.1,z,z*1.13,'mkf');
  for(let x=Math.floor(L/3)*3;x<R;x+=3){ if(x+1.6>-3.7&&x<3.7) continue; o+=quad(x,x+1.6,11.35,11.65,'mkf'); }
  ['S','N','E','W'].forEach(a=>{ if(has(a)&&s.drive!==a) o+=fpStopLine(a,lineType(s,a)); });
  if(s.zebra==='N') for(let x=-3.3;x<3.4;x+=.95) o+=quad(x,x+.5,17.3,19.9,'mkf');
  s.cars.forEach(c=>{ o+=fpArrow(c); });
  const byZ={N:16.6,E:13.25,W:9.75}, items=[];
  s.cars.filter(c=>c.id!=='du').forEach(c=>items.push([byZ[c.arm],()=>{
    let g=`<g class="tap" data-party="${c.id}">`;
    if(c.arm==='N') g+=frontCar(c,-1.75,16.6);
    else if(c.arm==='E') g+=sideCar(c,5.9,13.25,-1);
    else if(c.arm==='W') g+=sideCar(c,-5.9,9.75,1);
    return g+`</g>`; }]));
  (s.peds||[]).forEach(pd=>items.push([pd.pos[1],()=>fpPed(pd)]));
  items.sort((a,b)=>b[0]-a[0]).forEach(it=>{ o+=it[1](); });
  if(s.police){ const p=P(0,11.5); o+=`<text x="${p[0]}" y="${p[1]}" font-size="${(1.9*F/11.5).toFixed(1)}" text-anchor="middle">👮</text>`; }
  o+=postStack(s);
  o+=`<path class="tap" data-party="du" d="M-10,300 V285 Q200,256 410,285 V300Z" fill="${COLORS.du}"/><path d="M70,281 Q200,263 330,281" stroke="rgba(255,255,255,.32)" stroke-width="2" fill="none"/>`;
  o+=`<text class="clabel" x="200" y="290" style="font-size:11px">Du</text>`+pickBadge(222,285,'du');
  if(du.move==='left')  o+=`<path class="blinkg" d="M24,284 l11,-8 v4.5 h11 v7 h-11 v4.5z"/>`;
  if(du.move==='right') o+=`<path class="blinkg" d="M376,284 l-11,-8 v4.5 h-11 v7 h11 v4.5z"/>`;
  return o+`</svg>`;
}

/* ---------- Speicher ---------- */
const KEY='vorfahrt-coach-v1';
let stats = {};
try{ stats = JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ stats={}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(stats)); }catch(e){} }

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const inner=$('inner'), chat=$('chat'), cbox=$('cbox');
let state = {mode:null, queue:[], idx:0, right:0, answered:0, cur:null, retried:new Set(), cardEl:null};

function esc(t){return t.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollDown(){ requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'})); }

function addAI(html){
  const m=document.createElement('div'); m.className='msg ai';
  m.innerHTML=`<div class="avatar">${WHEEL}</div><div class="body">${html}</div>`;
  inner.appendChild(m); scrollDown(); return m;
}
function addUser(text){
  const m=document.createElement('div'); m.className='msg user';
  m.innerHTML=`<div class="bubble">${esc(text)}</div>`; inner.appendChild(m); scrollDown();
}
function setProgress(){
  const p=$('progress');
  if(!state.mode){p.hidden=true;return;}
  p.hidden=false; p.textContent=`${Math.min(state.idx+1,state.queue.length)} / ${state.queue.length}`;
}
function modeName(m){ return m==='all'?'Alle Situationen':m==='fehler'?'Fehler wiederholen':CATS[m]; }
function idsFor(mode){
  if(mode==='all') return SC.map(s=>s.id);
  if(mode==='fehler') return SC.filter(s=>stats[s.id] && stats[s.id].last===false).map(s=>s.id);
  return SC.filter(s=>s.cat===mode).map(s=>s.id);
}

function renderNav(){
  const modes=['all',...Object.keys(CATS),'fehler'];
  $('nav').innerHTML = modes.map(m=>`<button class="navbtn ${state.mode===m?'active':''}" data-mode="${m}"><span>${modeName(m)}</span><span class="cnt">${idsFor(m).length}</span></button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ closeSide(); start(b.dataset.mode); });
  $('stats').innerHTML = Object.keys(CATS).map(c=>{
    const ids=SC.filter(s=>s.cat===c), ok=ids.filter(s=>stats[s.id]&&stats[s.id].last).length;
    return `<div class="stat"><div class="row"><span>${CATS[c]}</span><span>${ok}/${ids.length}</span></div><div class="bar"><i style="width:${ids.length?ok/ids.length*100:0}%"></i></div></div>`;
  }).join('');
}

function welcome(){
  state={mode:null,queue:[],idx:0,right:0,answered:0,cur:null,retried:new Set(),cardEl:null};
  $('topTitle').textContent='Vorfahrt-Coach'; setProgress(); renderNav();
  const done = SC.filter(s=>stats[s.id]&&stats[s.id].last).length;
  inner.innerHTML = `<div class="welcome"><div class="mark">${WHEEL}</div>
    <h1>Wer hat hier Vorfahrt?</h1>
    <p>Trainier Vorfahrtstraßen, abknickende Vorfahrt und knifflige Kreuzungen – Situation für Situation, mit Auflösung.${done?` Du hast schon ${done} von ${SC.length} sicher.`:''}</p>
    <div class="chips">
      <button class="chip" data-mode="all">🚦 Alle Situationen</button>
      <button class="chip" data-mode="vs">🔶 Vorfahrtstraße</button>
      <button class="chip" data-mode="abk">↪️ Abknickende Vorfahrt</button>
      <button class="chip" data-mode="fuss">🚶 Fußgänger</button>
      <button class="chip" data-mode="sonder">🅿️ Sonderfälle</button>
      <button class="chip" data-act="sheet">📋 Spickzettel</button>
    </div></div>`;
  inner.querySelectorAll('.chip').forEach(b=>b.onclick=()=> b.dataset.act==='sheet' ? showSheet() : start(b.dataset.mode));
  cbox.innerHTML='';
}

function start(mode){
  const ids=idsFor(mode);
  state={mode,queue:shuffle(ids),idx:0,right:0,answered:0,cur:null,retried:new Set(),cardEl:null};
  inner.innerHTML=''; renderNav();
  $('topTitle').textContent=modeName(mode);
  if(!ids.length){
    addAI(`<p>Gerade gibt es nichts zu wiederholen – alle Situationen, die du schon gemacht hast, sitzen. 👍</p>`);
    setProgress(); endActions(); return;
  }
  addUser(modeName(mode));
  addAI(`<p>Okay, ${ids.length} Situationen. Geh jedes Mal gleich vor: <b>erst Schilder und Ampeln</b>, dann schauen, wer auf der Vorfahrtstraße ist, dann die Abbiegeregeln.</p><p>Falsch beantwortete Situationen kommen in dieser Runde nochmal.</p>`);
  next();
}

function partyList(s){ return ['du', ...s.cars.filter(c=>c.id!=='du').map(c=>c.id), ...((s.peds||[]).length?['ped']:[])]; }
function partyLabel(s,p){ if(p==='du') return 'Du'; if(p==='ped') return 'Fußgänger'; const c=s.cars.find(k=>k.id===p); return c&&c.kind==='rtw'?'Rettungswagen':p; }
function partyColor(s,p){ const c=s.cars.find(k=>k.id===p); return c&&c.kind==='rtw'?'#D32F2F':(COLORS[p]||'#888'); }
function fmtOrder(s){ return s.order.map(g=>g.length>1?g.map(p=>partyLabel(s,p)).join(' + ')+' (gleichzeitig)':partyLabel(s,g[0])).join(' → '); }
function duFirst(s){ return s.order[0].length===1 && s.order[0][0]==='du'; }

function next(){
  if(state.idx>=state.queue.length){ finish(); return; }
  setProgress();
  const s = SC.find(x=>x.id===state.queue[state.idx]); state.cur=s; state.rel=rel(s); state.phase='yn'; PICKS={};
  const m = addAI(`<div class="label">${CATS[s.cat]}</div>
    <div class="card"><div class="sc">${fpScene(state.rel)}</div>
    <div class="legend"><span>Deine Sicht – lies dein Schild</span><span>Pfeile = geplante Richtung</span><span>Blinker blinkt</span></div></div>
    ${s.hint?`<p class="hint">${esc(s.hint)}</p>`:''}<p><b>Kannst du einfach fahren?</b></p>`);
  state.cardEl = m.querySelector('.sc');
  cbox.innerHTML = `<div class="chint">Hast du gerade freie Fahrt?</div><div class="parties">
    <button class="party yn" id="yesBtn"><i style="background:var(--ok)"></i>Ja</button>
    <button class="party yn" id="noBtn"><i style="background:var(--bad)"></i>Nein</button></div>`;
  $('yesBtn').onclick=()=>answerYN(true); $('noBtn').onclick=()=>answerYN(false);
}

function answerYN(yes){
  const s=state.cur; if(!s||state.phase!=='yn') return;
  addUser(yes?'Ja':'Nein');
  const first=duFirst(s);
  if(yes!==first){ finishSit(false, first?'Doch – hier darfst du einfach fahren.':'Nein – du musst hier warten.'); return; }
  if(first){ finishSit(true,'Richtig – du hast freie Fahrt.'); return; }
  if(partyList(s).length<=2){ finishSit(true,'Richtig – du musst warten.'); return; }
  state.phase='order';
  addAI(`<div class="verdict ok">✓ Richtig, du musst warten</div><p><b>Wer fährt wann?</b> Wähl die richtige Reihenfolge.</p>`);
  orderUI();
}

function perms(a){ if(a.length<=1) return [a]; const r=[]; a.forEach((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).forEach(q=>r.push([x,...q]))); return r; }
function fitsOrder(s,seq){ let i=0; for(const g of s.order){ const part=seq.slice(i,i+g.length); i+=g.length; if(!g.every(x=>part.includes(x))) return false; } return true; }
function orderUI(){
  const s=state.cur;
  const wrong=shuffle(perms(partyList(s)).filter(q=>!fitsOrder(s,q))).slice(0,3).map(q=>[q.map(x=>partyLabel(s,x)).join(' → '),0]);
  const opts=shuffle([[fmtOrder(s),1],...wrong]);
  cbox.innerHTML = `<div class="chint">Wähle die richtige Reihenfolge</div>` + opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o[0])}</span></button>`).join('');
  cbox.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>pickOrder(opts[+btn.dataset.i]));
  state.orderOpts=opts;
}
function pickOrder(o){
  if(!state.cur||state.phase!=='order') return;
  addUser(o[0]);
  finishSit(!!o[1], o[1]?'Richtig – Reihenfolge stimmt.':'Reihenfolge nicht ganz.');
}

function finishSit(ok, head){
  const s=state.cur; state.cur=null; state.phase='done';
  state.answered++; if(ok) state.right++;
  const st = stats[s.id] || {seen:0,right:0};
  st.seen++; if(ok) st.right++; st.last=ok; stats[s.id]=st; save();
  PICKS={};
  if(state.cardEl) state.cardEl.innerHTML = fpScene(state.rel) + `<div class="sol-label">Auflösung von oben · ${esc(s.title)}${s.cat==='abk'?'<br>Jedes Zusatzzeichen ist aus Sicht seiner eigenen Zufahrt gezeichnet – deshalb sieht es an jeder Ecke anders aus.':''}</div>` + scene(state.rel,true);
  addAI(`<div class="verdict ${ok?'ok':'bad'}">${ok?'✓':'✗'} ${esc(head)}</div>
    ${duFirst(s)?'':`<p>Reihenfolge: <b>${esc(fmtOrder(s))}</b></p>`}
    <p>${esc(s.ex)}</p>
    <p style="font-size:14px;color:var(--muted);font-family:var(--sans)">${s.main?'Gelb markiert: Verlauf der Vorfahrtstraße. ':''}Zahlen im Bild: Reihenfolge.</p>
    <div class="tip"><b>Merke:</b> ${esc(s.tip)}</div>`);
  if(!ok && !state.retried.has(s.id)){
    state.retried.add(s.id);
    state.queue.splice(Math.min(state.idx+4,state.queue.length),0,s.id);
  }
  state.idx++; renderNav(); setProgress();
  const last = state.idx>=state.queue.length;
  cbox.innerHTML = `<div class="actions"><button class="primary" id="nextBtn">${last?'Ergebnis ansehen':'Nächste Situation'} →</button></div>`;
  $('nextBtn').onclick=()=>{ cbox.innerHTML=''; next(); };
}

function finish(){
  $('progress').hidden=true;
  const pct = state.answered ? Math.round(state.right/state.answered*100) : 0;
  const msg = pct>=90 ? 'Stark – das sitzt.' : pct>=70 ? 'Solide. Die Fehler kommen unter „Fehler wiederholen“ nochmal.' : 'Da ist noch Luft. Schau dir den Spickzettel an und wiederhol die Fehler.';
  addAI(`<p><b>Runde fertig:</b> ${state.right} von ${state.answered} richtig (${pct} %).</p><p>${msg}</p>`);
  endActions();
}
function endActions(){
  const m=state.mode;
  cbox.innerHTML = `<div class="actions">
    <button class="ghost" id="a1">Spickzettel</button>
    <button class="ghost" id="a2">Fehler wiederholen</button>
    <button class="primary" id="a3">Nochmal</button></div>`;
  $('a1').onclick=showSheet; $('a2').onclick=()=>start('fehler'); $('a3').onclick=()=>start(m&&m!=='fehler'?m:'all');
}

function mini(t){ return `<svg viewBox="-13 -13 26 26">${signSVG(t)}</svg>`; }
function showSheet(){
  closeSide();
  if(inner.querySelector('.welcome')){ inner.innerHTML=''; $('topTitle').textContent='Spickzettel'; }
  addUser('Spickzettel');
  addAI(`<div class="sheet">
    <h3>Wer regelt? (von oben nach unten)</h3>
    <ol><li>Polizei</li><li>Ampel</li><li>Verkehrszeichen</li><li>Rechts vor links</li></ol>
    <h3>Die wichtigsten Schilder</h3>
    <div class="signrow">${mini('306')}<span><b>306 Vorfahrtstraße</b> – Vorfahrt bis zum Ende-Schild (307).</span></div>
    <div class="signrow">${mini('301')}<span><b>301 Vorfahrt</b> – nur an der nächsten Kreuzung.</span></div>
    <div class="signrow">${mini('205')}<span><b>205 Vorfahrt gewähren</b> – Vorfahrtstraße zuerst, rechtzeitig langsam werden.</span></div>
    <div class="signrow">${mini('206')}<span><b>206 Stopp</b> – immer anhalten, dann Vorfahrt gewähren.</span></div>
    <div class="signrow"><svg viewBox="-14 -14 28 28">${zusatzSVG('S',['N','E','S','W'],['S','W'])}</svg><span><b>Zusatzzeichen</b> – dicke Linie = Verlauf der abknickenden Vorfahrtstraße. Wer ihr folgt, blinkt.</span></div>
    <h3>Abknickende Vorfahrt</h3>
    <ul><li>Wer auf der dicken Linie ist, hat Vorrang vor den Nebenstraßen.</li><li>Nebenstraße gegen Nebenstraße: rechts vor links.</li><li>Beide auf der Vorfahrtstraße: Wer dem Knick folgt, fährt. Wer sie verlässt (auch geradeaus!) und kreuzt, wartet.</li><li>Dem Knick folgen = abbiegen: blinken.</li></ul>
    <h3>Abbiegen</h3>
    <ul><li>Linksabbieger lässt den Gegenverkehr durch – auch auf der Vorfahrtstraße und bei Grün.</li><li>Grünpfeil-Schild: erst anhalten, dann vorsichtig abbiegen.</li></ul>
    <h3>Fußgänger</h3>
    <ul><li>Beim Abbiegen: Wer die Straße quert, in die du einbiegst, geht vor – egal von welcher Seite.</li><li>Wer nur auf dem Gehweg entlangläuft, quert nicht – kein Konflikt.</li><li>Zebrastreifen: queren lassen. Liegt er hinter der Kreuzung, vor der Kreuzung warten.</li></ul>
    <h3>Du bist immer der Letzte, wenn …</h3>
    <ul><li>du aus einem Grundstück, Parkplatz oder verkehrsberuhigten Bereich kommst,</li><li>du über einen abgesenkten Bordstein fährst,</li><li>Blaulicht + Martinshorn kommt.</li></ul>
    </div>`);
  if(state.cur){ /* laufende Frage bleibt offen */ } else if(!state.mode){ cbox.innerHTML=`<div class="actions"><button class="primary" id="s1">Training starten →</button></div>`; $('s1').onclick=()=>start('all'); }
}

/* ---------- Sidebar mobil ---------- */
function openSide(){ $('side').classList.add('open'); $('scrim').classList.add('show'); }
function closeSide(){ $('side').classList.remove('open'); $('scrim').classList.remove('show'); }
$('menuBtn').onclick=openSide; $('scrim').onclick=closeSide;
$('newBtn').onclick=()=>{closeSide();welcome();}; $('newBtn2').onclick=welcome;
$('sheetBtn').onclick=showSheet;
$('resetBtn').onclick=()=>{ if(confirm('Gesamten Fortschritt löschen?')){ stats={}; save(); welcome(); } };

/* Tastatur: 1–4 antworten, Enter = weiter */
document.addEventListener('keydown',e=>{
  if(state.phase==='yn' && /^[jJ]$/.test(e.key)) answerYN(true);
  else if(state.phase==='yn' && /^[nN]$/.test(e.key)) answerYN(false);
  else if(state.phase==='order' && /^[1-4]$/.test(e.key)){ const o=(state.orderOpts||[])[+e.key-1]; if(o) pickOrder(o); }
  else if(e.key==='Enter'){ const b=$('nextBtn'); if(b) b.click(); }
});

welcome();
</script>
